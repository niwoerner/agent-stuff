name: Publish lint rules

on:
  push:
    branches: [main]
    tags:
      - "lint-typescript-v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-lint-typescript
  cancel-in-progress: false

env:
  PKG_DIR: lint/typescript
  TAG_PREFIX: lint-typescript-v

jobs:
  publish:
    name: Publish @niwoerner/oxlint-rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lint/typescript
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/${TAG_PREFIX}* ]]; then
            version="${GITHUB_REF_NAME#"$TAG_PREFIX"}"
            echo "Manual tag: $version"
          else
            base="${{ github.event.before }}"
            if [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base" 2>/dev/null; then
              base="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
            if [ -n "$base" ] && git diff --quiet "$base" HEAD -- . ':!README.md'; then
              echo "No package changes in this push; skipping."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            latest="$(git tag --list "${TAG_PREFIX}*" | sed "s/^${TAG_PREFIX}//" | sort -V | tail -1)"
            if [ -z "$latest" ]; then
              version="0.0.1"
            else
              IFS=. read -r major minor patch <<<"$latest"
              version="$major.$minor.$((patch + 1))"
            fi
            echo "Auto patch: ${latest:-none} -> $version"
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_PREFIX}${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        if: steps.version.outputs.run == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.run == 'true'
      - run: bun install --frozen-lockfile
        if: steps.version.outputs.run == 'true'
      - run: bun run lint
        if: steps.version.outputs.run == 'true'
      - run: bun run typecheck
        if: steps.version.outputs.run == 'true'
      - run: bun run test
        if: steps.version.outputs.run == 'true'

      - name: Skip if version already on npm
        id: published
        if: steps.version.outputs.run == 'true'
        run: |
          name="$(jq -r .name package.json)"
          if npm view "${name}@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "${name}@${{ steps.version.outputs.version }} already published; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag
        if: steps.version.outputs.run == 'true' && steps.published.outputs.skip == 'false' && !startsWith(github.ref, 'refs/tags/')
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Publish to npm
        if: steps.version.outputs.run == 'true' && steps.published.outputs.skip == 'false'
        run: |
          npm version --no-git-tag-version "${{ steps.version.outputs.version }}"
          npm publish --provenance
          npm pack

      - name: Create or update GitHub release
        if: steps.version.outputs.run == 'true' && steps.published.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./*.tgz --clobber
          else
            gh release create "$TAG" ./*.tgz --generate-notes --title "$TAG"
          fi
